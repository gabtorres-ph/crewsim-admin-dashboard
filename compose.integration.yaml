name: crewsim-local

include:
  - path: ../core-crewsim/compose.yaml

services:
  frontend:
    build:
      context: .
      args:
        NIXPACKS_NODE_VERSION: ${NIXPACKS_NODE_VERSION:-24}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    environment:
      CORE_API_URL: ${CORE_API_URL:-http://api:8000}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
